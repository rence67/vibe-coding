<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - IT Helpdesk Repair Shop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="/index.html" class="site-brand">
        <span>School IT Helpdesk</span>
        <span class="brand-badge">Admin Portal</span>
      </a>
      <nav class="nav-links">
        <a href="/index.html" class="nav-link">Main Site</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="toast-banner" class="toast-banner"></div>

    <div class="form-card" style="margin-top: 2rem;">
      <h1 class="page-title">Admin Login</h1>
      <p class="page-subtitle">Enter your administrative credentials to manage repair bookings.</p>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username" class="form-label">Username *</label>
          <input type="text" id="username" class="form-input" placeholder="Enter admin username" autocomplete="username">
          <div id="username-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password *</label>
          <input type="password" id="password" class="form-input" placeholder="Enter admin password" autocomplete="current-password">
          <div id="password-error" class="form-error"></div>
        </div>

        <button type="submit" id="login-btn" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
    </div>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
