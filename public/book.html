<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book a Repair Appointment</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="/index.html" class="site-brand">
        <span>School IT Helpdesk</span>
        <span class="brand-badge">Repair Shop</span>
      </a>
      <nav class="nav-links">
        <a href="/index.html" class="nav-link">Services</a>
        <a href="/book.html" class="nav-link active">Book Repair</a>
        <a href="/status.html" class="nav-link">Check Status</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <div id="toast-banner" class="toast-banner"></div>

    <div class="form-card">
      <h1 class="page-title">Schedule Appointment</h1>
      <p class="page-subtitle">Fill out the details below to complete your service booking.</p>

      <form id="booking-form" novalidate>
        <div class="form-group">
          <label for="service_id" class="form-label">Select Service *</label>
          <select id="service_id" class="form-select">
            <option value="">Loading services...</option>
          </select>
          <div id="service_id-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="booking_date" class="form-label">Date *</label>
          <input type="date" id="booking_date" class="form-input">
          <div id="booking_date-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label">Select Time Slot (07:00 AM - 05:00 PM) *</label>
          <input type="hidden" id="booking_time">
          <div id="time-slots-container" class="time-slots-grid"></div>
          <div id="booking_time-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="guests" class="form-label">Number of Devices / Guests *</label>
          <input type="number" id="guests" class="form-input" value="1" min="1">
          <div id="guests-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="name" class="form-label">Full Name *</label>
          <input type="text" id="name" class="form-input" placeholder="e.g. Juan Cruz">
          <div id="name-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="contact" class="form-label">Contact Number *</label>
          <input type="text" id="contact" class="form-input" placeholder="e.g. 09171234567">
          <div id="contact-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">Email Address *</label>
          <input type="email" id="email" class="form-input" placeholder="e.g. juan@example.com">
          <div id="email-error" class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="notes" class="form-label">Additional Notes / System Issue Description</label>
          <textarea id="notes" class="form-textarea" placeholder="Briefly describe the PC issue or device details..."></textarea>
          <div id="notes-error" class="form-error"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-primary" style="width: 100%;">Submit Booking</button>
      </form>
    </div>
  </main>

  <script src="/js/main.js"></script>
</body>
</html>
